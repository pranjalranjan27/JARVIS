<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Jarvis | AI Assistant</title>
  <meta name="description" content="Jarvis — a sarcastic, witty AI assistant powered by local LLM intelligence." />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ═══ Sidebar ═══ -->
  <nav id="sidebar" class="sidebar">
    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">
        <span class="material-symbols-outlined brand-icon-symbol">auto_awesome</span>
      </div>
      <h1 class="brand-title">Jarvis</h1>
    </div>

    <!-- Actions -->
    <div class="sidebar-actions">
      <button id="btn-new-chat" class="sidebar-btn sidebar-btn-primary">
        <span class="material-symbols-outlined">add</span>
        <span>New Chat</span>
      </button>
      <button id="btn-history-toggle" class="sidebar-btn">
        <span class="material-symbols-outlined">history</span>
        <span>History</span>
      </button>
    </div>

    <!-- History List -->
    <div id="history-list" class="history-list"></div>
  </nav>

  <!-- ═══ Main Content ═══ -->
  <main class="main-content">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="top-bar-title">Jarvis AI</span>
      </div>
      <div id="connection-status" class="top-bar-status disconnected">
        <span class="status-dot"></span>
        <span>Disconnected</span>
      </div>
    </header>

    <!-- Chat Area -->
    <div id="chat-scroll" class="chat-scroll">
      <!-- Welcome Screen -->
      <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-icon-wrap">
          <span class="material-symbols-outlined welcome-icon icon-filled">psychology</span>
        </div>
        <h2 class="welcome-title">What can I help you with?</h2>
        <p class="welcome-subtitle">Ask a question, run a command, or just say hello.</p>
        <div class="welcome-chips">
          <button class="chip" data-message="What time is it?">What time is it?</button>
          <button class="chip" data-message="Tell me a joke">Tell me a joke</button>
          <button class="chip" data-message="Open chrome">Open Chrome</button>
          <button class="chip" data-message="Calculate 256 * 12">Calculate 256 × 12</button>
        </div>
      </div>

      <!-- Message Thread -->
      <div id="chat-messages" class="chat-messages"></div>

      <!-- Thinking Indicator -->
      <div id="thinking-indicator" class="thinking-indicator">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="thinking-text">Jarvis is thinking…</span>
      </div>

      <!-- Slow response indicator -->
      <div id="slow-indicator" class="slow-indicator">
        Taking longer than usual…
      </div>
    </div>

    <!-- Input Bar -->
    <div class="input-area">
      <div class="input-container">
        <div class="mode-selector-wrap" id="mode-selector-wrap">
          <button type="button" class="mode-selector-btn" id="mode-selector-btn" title="Personality mode">
            <span class="mode-selector-label" id="mode-selector-label">Sarcastic</span>
            <span class="material-symbols-outlined mode-selector-chevron" id="mode-selector-chevron">expand_more</span>
          </button>
          <div class="mode-dropdown" id="mode-dropdown">
            <div class="mode-dropdown-item active" data-mode="sarcastic">
              <span class="material-symbols-outlined mode-dropdown-icon">sentiment_very_satisfied</span>
              <span>Sarcastic</span>
            </div>
            <div class="mode-dropdown-item" data-mode="companion">
              <span class="material-symbols-outlined mode-dropdown-icon">favorite</span>
              <span>Companion</span>
            </div>
            <div class="mode-dropdown-item" data-mode="focus">
              <span class="material-symbols-outlined mode-dropdown-icon">target</span>
              <span>Focus</span>
            </div>
          </div>
        </div>
        <div class="mode-divider"></div>
        <input
          id="chat-input"
          type="text"
          class="chat-input"
          placeholder="Message Jarvis…"
          autocomplete="off"
        />
        <button id="btn-send" class="send-btn" title="Send message">
          <span class="material-symbols-outlined send-icon">arrow_upward</span>
        </button>
      </div>
    </div>

  </main>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
